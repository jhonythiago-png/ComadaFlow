<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#17140F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ComandaFlow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>ComandaFlow — Caixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="css/tokens.css">
<style>
  html { height: 100%; }

  /* ---- Tela: lista de comandas ---- */
  #tela-comandas { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .comandas-header {
    padding: 18px 20px 12px; display: flex; justify-content: space-between; align-items: baseline;
  }
  .comandas-header h2 { font-family: var(--font-display); font-size: 20px; font-weight: 700; }
  .comandas-header .contador { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }

  #grid-comandas {
    flex: 1; overflow-y: auto; padding: 4px 20px 24px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px;
    align-content: start;
  }
  .ticket-card {
    background: var(--ink-soft); border: 1px solid var(--ink-line); border-radius: 4px 4px var(--radius-md) var(--radius-md);
    padding: 16px; text-align: left; position: relative;
  }
  .ticket-row1 { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .badge {
    font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
    background: var(--crust); color: var(--ink); padding: 3px 8px; border-radius: 4px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex-shrink: 0; margin-top: 3px; }
  .ticket-numero { font-family: var(--font-display); font-weight: 700; font-size: 16px; margin-bottom: 2px; }
  .ticket-tempo { font-size: 11px; color: var(--text-muted); margin-bottom: 12px; }
  .ticket-divisor { border-top: 1px dashed var(--ink-line); margin-bottom: 10px; }
  .estagio-entrega {
    font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 6px; margin-bottom: 8px; display: inline-block;
  }
  .estagio-entrega.preparando { background: rgba(214,67,42,.14); color: #F0A08D; }
  .estagio-entrega.saiu { background: rgba(59,130,246,.14); color: #93C5FD; }
  .estagio-entrega.entregue { background: rgba(92,122,82,.18); color: #9CBF8F; }
  .ticket-total-row { display: flex; justify-content: space-between; align-items: baseline; }
  .ticket-total-row .label { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
  .ticket-total-row .valor { font-family: var(--font-mono); font-weight: 600; font-size: 16px; color: var(--crust); }
  .aviso-vazio { grid-column: 1/-1; text-align: center; color: var(--text-faint); padding: 60px 0; font-size: 14px; }

  /* ---- Tela: fechamento ---- */
  #tela-fechamento { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .fechamento-header {
    padding: 14px 20px; border-bottom: 1px solid var(--ink-line); display: flex; align-items: center; gap: 14px;
  }
  .fechamento-header button.voltar { font-size: 20px; color: var(--text-muted); }
  #fechamento-codigo { font-family: var(--font-mono); font-size: 11px; color: var(--crust); }
  #fechamento-titulo { font-family: var(--font-display); font-weight: 700; font-size: 17px; }

  .fechamento-corpo { flex: 1; overflow-y: auto; padding: 16px 20px; max-width: 640px; width: 100%; margin: 0 auto; }
  .secao-label { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: .05em; margin: 18px 0 8px; }
  .secao-label:first-child { margin-top: 0; }

  #fechamento-itens { background: var(--ink-soft); border: 1px solid var(--ink-line); border-radius: var(--radius-md); overflow: hidden; }
  .fechamento-item-linha {
    display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 14px;
    border-bottom: 1px solid var(--ink-line); gap: 10px;
  }
  .fechamento-item-linha:last-child { border-bottom: none; }
  .item-nome { font-size: 13px; font-weight: 600; }
  .item-detalhe { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .item-valor { font-family: var(--font-mono); font-size: 13px; color: var(--crust); flex-shrink: 0; }

  .linha-ajuste { display: flex; gap: 12px; }
  .campo-ajuste { flex: 1; }
  .campo-ajuste label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .campo-ajuste .sufixo { position: relative; }
  .campo-ajuste input { width: 100%; }

  .resumo-valores { background: var(--ink-soft); border: 1px solid var(--ink-line); border-radius: var(--radius-md); padding: 14px 16px; }
  .resumo-linha { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; color: var(--text-muted); }
  .resumo-linha.total { font-family: var(--font-display); font-weight: 800; font-size: 19px; color: var(--text-primary); border-top: 1px dashed var(--ink-line); margin-top: 8px; padding-top: 10px; }

  .pagamento-linha { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .pagamento-linha select { flex: 1.2; }
  .pagamento-linha input { flex: 1; }
  .troco-linha { display: flex; align-items: center; gap: 8px; margin: -2px 0 10px; padding-left: 4px; }
  .troco-linha label { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
  .troco-linha input { flex: 1; max-width: 100px; padding: 6px 8px; font-size: 12.5px; }
  .troco-resultado { font-family: var(--font-mono); font-size: 12px; color: var(--crust); font-weight: 600; white-space: nowrap; }
  .aviso-vazio-pequeno { color: var(--text-faint); font-size: 12px; padding: 10px 0; }
  .btn-add-pagamento {
    background: var(--ink-soft); border: 1px dashed var(--ink-line); color: var(--text-muted);
    width: 100%; padding: 10px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; margin-top: 6px;
  }

  .resumo-pagamento { display: flex; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--ink-line); font-size: 13px; }
  #resumo-diferenca.ok { color: var(--ok); font-weight: 700; }
  #resumo-diferenca.faltando { color: var(--paprika); font-weight: 700; }
  #resumo-diferenca.sobrando { color: var(--paprika); font-weight: 700; }

  .fechamento-footer {
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--ink-line); flex-shrink: 0;
    max-width: 640px; width: 100%; margin: 0 auto; box-sizing: border-box;
  }
  #btn-fechar-conta { width: 100%; }
  #btn-fechar-conta:disabled { opacity: .4; }

  .btn-transferir {
    background: var(--ink-line); color: var(--crust); border-radius: 6px;
    width: 26px; height: 26px; font-size: 14px; flex-shrink: 0;
  }

  .modal-transferencia-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal-transferencia-conteudo {
    background: var(--ink); border-radius: var(--radius-lg); padding: 22px;
    width: 100%; max-width: 360px;
  }
  .modal-transferencia-conteudo h3 { font-family: var(--font-display); margin-bottom: 10px; }
  .transferencia-item-label { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }
  .transferencia-item-label strong { color: var(--text-primary); }
  .lista-comandas-irmas { display: flex; flex-direction: column; gap: 8px; }
  .btn-comanda-irma { width: 100%; text-align: left; }
  #transferencia-qtd-container label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  #transferencia-qtd-container input { width: 100%; margin-bottom: 4px; }
</style>
</head>
<body class="app-shell">

<div id="sidebar"></div>

<div class="main-area">

<!-- TELA 1: lista de comandas -->
<div id="tela-comandas">
  <div class="comandas-header">
    <h2>Comandas abertas</h2>
    <span class="contador" id="contador-comandas">0 abertas</span>
  </div>
  <div id="grid-comandas"><div class="aviso-vazio">Carregando...</div></div>
</div>

<!-- TELA 2: fechamento -->
<div id="tela-fechamento">
  <div class="fechamento-header">
    <button class="voltar" onclick="fecharTelaFechamento()">←</button>
    <div>
      <div id="fechamento-codigo">COMANDA #—</div>
      <div id="fechamento-titulo">—</div>
    </div>
  </div>

  <div class="fechamento-corpo">
    <div class="secao-label">Itens do pedido</div>
    <div id="fechamento-itens"></div>

    <div class="secao-label">Ajustes</div>
    <div class="linha-ajuste">
      <div class="campo-ajuste">
        <label>Taxa de serviço (%)</label>
        <input type="text" inputmode="decimal" id="input-taxa-servico" oninput="atualizarTaxaServico(this.value)">
      </div>
      <div class="campo-ajuste">
        <label>Taxa de entrega (R$)</label>
        <input type="text" inputmode="decimal" id="input-taxa-entrega" oninput="atualizarTaxaEntrega(this.value)">
      </div>
    </div>

    <div class="secao-label">Resumo</div>
    <div class="resumo-valores">
      <div class="resumo-linha"><span>Subtotal</span><span id="valor-subtotal">R$ 0,00</span></div>
      <div class="resumo-linha"><span>Taxa de serviço</span><span id="valor-taxa-servico">R$ 0,00</span></div>
      <div class="resumo-linha total"><span>Total</span><span id="valor-total">R$ 0,00</span></div>
    </div>

    <div class="secao-label">Forma(s) de pagamento</div>
    <div id="lista-pagamentos"></div>
    <button class="btn-add-pagamento" onclick="adicionarPagamento()">+ Adicionar forma de pagamento</button>

    <div class="resumo-pagamento">
      <span>Total pago: <strong id="resumo-total-pago">R$ 0,00</strong></span>
      <span>Diferença: <strong id="resumo-diferenca">R$ 0,00</strong></span>
    </div>
  </div>

  <div class="fechamento-footer">
    <button id="btn-fechar-conta" class="btn-danger" disabled onclick="confirmarFechamento()">Fechar conta</button>
  </div>
</div>

<!-- MODAL: transferir item pra outra pessoa da mesma mesa -->
<div id="modal-transferencia-overlay" class="modal-transferencia-overlay">
  <div class="modal-transferencia-conteudo">
    <h3>Transferir item</h3>
    <p class="transferencia-item-label">Transferir <strong id="transferencia-item-nome"></strong> pra:</p>
    <div id="transferencia-qtd-container" class="campo" style="display:none;">
      <label>Quantas unidades transferir?</label>
      <input type="number" id="input-transferencia-qtd" min="1">
    </div>
    <div id="lista-comandas-irmas" class="lista-comandas-irmas"></div>
    <button class="btn-ghost" style="width:100%; margin-top:12px;" onclick="fecharModalTransferencia()">Cancelar</button>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/caixa.js"></script>

</div> <!-- fecha .main-area -->

</body>
</html>
